!
hostname leaf2
!
interface Ethernet1
   description P2P_TO_SPINE1
   no switchport
!
interface Ethernet2
   description P2P_TO_LEAF1
   no switchport
!
interface Loopback0
   ip address 10.255.2.1/32
!
router bgp 65102
   router-id 10.255.2.1
   neighbor 10.0.0.2 remote-as 65000
   network 10.255.2.1/32

!
username admin privilege 15 role network-admin secret admin
!
management api http-commands
   no shutdown
!
management api gnmi
   transport grpc default
   no shutdown
!
management api netconf
   transport ssh default
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   no shutdown
!
ip routing
!
ip routing vrf MGMT
!
management ssh
   vrf MGMT
      no shutdown
!
end
